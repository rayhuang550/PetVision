<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>PetVision · Vision Host</title>
<style>
  @font-face {
    font-family: "Hanken Grotesk";
    src: url("/assets/hanken-grotesk.woff2") format("woff2");
    font-style: normal;
    font-weight: 100 900;
    font-display: swap;
  }
  :root { color-scheme: dark; }
  body { font-family: system-ui, sans-serif; margin: 0; background: #14161a; color: #e8eaed; }
  header { padding: 14px 20px 10px; background: #1d2026; font-weight: 600; font-size: 18px; }
  .workspace-title { margin: 0; padding: 0 20px 12px; background: #1d2026;
                     color: #9aa0a6; font-size: 14px; }
  main { display: flex; flex-wrap: wrap; gap: 20px; padding: 20px; }
  .card { background: #1d2026; border-radius: 12px; padding: 16px; }
  video, canvas, #preview { width: 480px; max-width: 90vw; border-radius: 10px; background: #000; display: block; }
  [hidden] { display: none !important; }
  #preview { object-fit: contain; min-height: 200px; }
  #out { width: 480px; max-width: 90vw; border-radius: 10px; background: #000; display: none; }
  button { font-size: 15px; padding: 9px 16px; margin: 6px 6px 0 0; border: 0; border-radius: 8px;
           background: #3b82f6; color: #fff; cursor: pointer; }
  button.secondary { background: #2d3138; }
  button:disabled { opacity: 0.45; cursor: default; }
  input { font-size: 15px; padding: 8px; border-radius: 8px; border: 1px solid #3a3f47;
          background: #14161a; color: #e8eaed; }
  input[type=file] { padding: 6px; }
  .tabs { margin-bottom: 12px; }
  .tabs button { background: #2d3138; }
  .tabs button.active { background: #3b82f6; }
  #verdict { font-size: 30px; font-weight: 700; margin: 10px 0 4px; }
  #sub { color: #9aa0a6; margin-bottom: 10px; }
  .bar { height: 10px; background: #2d3138; border-radius: 5px; overflow: hidden; margin: 6px 0; }
  .bar > div { height: 100%; background: #22c55e; }
  .row { display: flex; justify-content: space-between; font-size: 13px; color: #c8ccd1; }
  .muted { color: #9aa0a6; font-size: 13px; }
  ul { padding-left: 18px; }
  .hint { font-size: 12px; color: #6b7178; margin-top: 4px; }
  .requests-view { display: grid; grid-template-columns: minmax(280px, 380px) minmax(0, 1fr);
                   align-items: start; max-width: 1500px; margin: 0 auto; }
  .request-browser { padding: 0; overflow: hidden; }
  .request-tools { padding: 14px; border-bottom: 1px solid #30343b; }
  .request-tools-row { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
  select { min-width: 0; padding: 7px; border: 1px solid #3a3f47; border-radius: 7px;
           background: #14161a; color: #e8eaed; }
  .request-tools button { font-size: 13px; padding: 7px 10px; margin: 0; }
  #requestList { max-height: calc(100vh - 215px); overflow: auto; }
  .request-row { width: 100%; display: block; text-align: left; padding: 12px 14px; margin: 0;
                 border-radius: 0; border-bottom: 1px solid #2a2e34; background: transparent; }
  .request-row:hover, .request-row.selected { background: #282d35; }
  .request-row-top, .request-row-sub { display: flex; align-items: center; justify-content: space-between;
                                       gap: 8px; }
  .request-row-sub { margin-top: 5px; color: #9aa0a6; font-size: 12px; }
  .endpoint { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-weight: 650; }
  .status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 7px; }
  .status-completed { background: #22c55e; }
  .status-failed { background: #ef4444; }
  .status-processing { background: #f59e0b; animation: pulse 1s infinite alternate; }
  @keyframes pulse { from { opacity: .35; } to { opacity: 1; } }
  .request-detail { min-width: 0; }
  .detail-heading { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px;
                    align-items: baseline; margin-bottom: 12px; }
  .detail-heading h2 { margin: 0; font-size: 22px; }
  .detail-heading code { color: #9aa0a6; font-size: 12px; }
  .image-stage { position: relative; background: #090a0c; border-radius: 10px; overflow: hidden; }
  #requestImage { display: block; width: 100%; max-height: 66vh; object-fit: contain; }
  .legend { display: flex; gap: 18px; margin: 9px 0 18px; color: #9aa0a6; font-size: 12px; }
  .legend span::before { content: ''; display: inline-block; width: 20px; margin-right: 6px;
                         vertical-align: 3px; border-top: 2px solid #f59e0b; }
  .legend .crop-key::before { border-color: #22d3ee; border-top-style: dashed; }
  .meta-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px;
               margin: 12px 0 18px; }
  .meta { padding: 10px; border-radius: 8px; background: #171a1f; min-width: 0; }
  .meta-label { color: #7d848d; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
  .meta-value { margin-top: 4px; overflow-wrap: anywhere; }
  .error-box { padding: 12px; border: 1px solid #7f1d1d; border-radius: 8px; background: #351517;
               color: #fecaca; margin: 12px 0; }
  .detection-card { display: grid; grid-template-columns: minmax(120px, 210px) minmax(220px, 1fr);
                    gap: 16px; padding: 14px; margin-top: 12px; border: 1px solid #30343b;
                    border-radius: 10px; background: #191c21; }
  .crop-image { width: 100%; max-height: 210px; object-fit: contain; border-radius: 8px; background: #000; }
  .detection-title { font-weight: 700; margin-bottom: 8px; }
  .score-note { color: #9aa0a6; font-size: 12px; margin: 8px 0; }
  .score-table .bar { margin-bottom: 9px; }
  .empty-state { padding: 34px 20px; text-align: center; color: #9aa0a6; }
  .danger { background: #7f1d1d !important; }
  @media (max-width: 820px) {
    .requests-view { grid-template-columns: 1fr; }
    #requestList { max-height: 300px; }
    .detection-card { grid-template-columns: 1fr; }
    .request-detail { padding-top: 0; }
  }

  body.requests-mode {
    --void: #fff;
    --panel: #f1f1f3;
    --panel-2: #e6e6e9;
    --paper: #111114;
    --dim: #6c6c74;
    --faint: #9a9aa2;
    --hairline: rgba(0, 0, 0, .09);
    --kibble: #c98a3b;
    --ok: #3e8e52;
    --bad: #c0472f;
    --raw-box: #c98a3b;
    --crop-box: #3e8e52;
    min-height: 100vh;
    background: var(--void);
    color: var(--paper);
    color-scheme: light;
    font-family: "Hanken Grotesk", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  body.requests-mode *,
  body.requests-mode *::before,
  body.requests-mode *::after { box-sizing: border-box; }
  .site-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
  }
  .brand-lockup { display: flex; align-items: center; gap: 10px; }
  .brand-copy { display: flex; align-items: baseline; gap: 8px; }
  .brand-copy strong { font-size: 17px; }
  .brand-copy span, .pipeline-copy { color: #9aa0a6; font-size: 13px; font-weight: 500; }
  body.requests-mode .site-header {
    padding: 22px 32px 10px;
    background: var(--void);
    color: var(--paper);
  }
  body.requests-mode .brand-copy strong {
    font-size: 18px;
    font-weight: 750;
    letter-spacing: -.02em;
  }
  body.requests-mode .brand-copy span,
  body.requests-mode .pipeline-copy { color: var(--dim); }
  body.requests-mode .workspace-title {
    margin: 0;
    padding: 0 32px 18px;
    background: var(--void);
    border-bottom: 1px solid var(--hairline);
    color: var(--paper);
    font: 650 14px/1 "Hanken Grotesk", system-ui, sans-serif;
  }
  body.requests-mode .requests-view {
    grid-template-columns: minmax(290px, 350px) minmax(0, 1fr);
    gap: 28px;
    align-items: start;
    width: 100%;
    max-width: 1540px;
    margin: 0 auto;
    padding: 28px 32px 56px;
  }
  body.requests-mode .card {
    border-radius: 20px;
    background: var(--panel);
  }
  body.requests-mode .request-browser {
    position: sticky;
    top: 20px;
    overflow: hidden;
    padding: 0;
  }
  body.requests-mode .request-tools {
    padding: 20px;
    border-bottom: 1px solid var(--hairline);
  }
  .request-tools-head {
    display: flex;
    align-items: start;
    justify-content: space-between;
    gap: 12px;
  }
  .request-eyebrow {
    display: block;
    margin-bottom: 2px;
    color: var(--dim);
    font-size: 12px;
    font-weight: 550;
  }
  body.requests-mode .request-tools strong {
    display: block;
    font-size: 20px;
    font-weight: 720;
    letter-spacing: -.018em;
  }
  body.requests-mode .request-tools .muted {
    margin-top: 5px;
    color: var(--dim);
    font-size: 12px;
    font-variant-numeric: tabular-nums;
  }
  body.requests-mode .request-tools-row { gap: 8px; margin-top: 14px; }
  body.requests-mode select {
    min-width: 0;
    flex: 1;
    padding: 10px 11px;
    border: 0;
    border-radius: 12px;
    background: var(--void);
    color: var(--paper);
    font: 550 13px/1.2 "Hanken Grotesk", system-ui, sans-serif;
  }
  body.requests-mode .request-tools button {
    margin: 0;
    padding: 9px 14px;
    border-radius: 999px;
    font: 650 13px/1 "Hanken Grotesk", system-ui, sans-serif;
  }
  body.requests-mode #liveToggle {
    background: var(--paper);
    color: var(--void);
  }
  body.requests-mode #clearHistory {
    background: transparent !important;
    color: var(--bad);
  }
  body.requests-mode #requestList {
    max-height: calc(100vh - 284px);
    overflow: auto;
    padding: 7px;
    scrollbar-width: thin;
    scrollbar-color: var(--faint) transparent;
  }
  body.requests-mode .request-row {
    width: 100%;
    margin: 0;
    padding: 13px 12px;
    border: 0;
    border-radius: 14px;
    background: transparent;
    color: var(--paper);
    font-family: "Hanken Grotesk", system-ui, sans-serif;
  }
  body.requests-mode .request-row + .request-row { margin-top: 2px; }
  body.requests-mode .request-row:hover { background: var(--panel-2); }
  body.requests-mode .request-row.selected {
    background: var(--void);
    box-shadow: 0 1px 0 var(--hairline), 0 4px 14px rgba(0, 0, 0, .06);
  }
  body.requests-mode .request-row-top { font-size: 13px; font-variant-numeric: tabular-nums; }
  body.requests-mode .request-row-sub {
    margin-top: 5px;
    color: var(--dim);
    font-size: 12px;
    font-variant-numeric: tabular-nums;
  }
  body.requests-mode .endpoint {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-weight: 700;
    letter-spacing: -.02em;
  }
  body.requests-mode .status-completed { background: var(--ok); }
  body.requests-mode .status-failed { background: var(--bad); }
  body.requests-mode .status-processing { background: var(--kibble); }
  body.requests-mode .request-detail {
    min-width: 0;
    padding: 0;
    background: transparent;
  }
  body.requests-mode .detail-heading {
    align-items: start;
    margin: 1px 0 18px;
  }
  .detail-eyebrow {
    margin: 0 0 3px;
    color: var(--dim);
    font-size: 13px;
    font-weight: 550;
  }
  body.requests-mode .detail-heading h2 {
    margin: 0;
    color: var(--paper);
    font-size: clamp(27px, 3vw, 40px);
    font-weight: 690;
    letter-spacing: -.032em;
    line-height: 1.05;
  }
  .detail-heading-meta {
    display: flex;
    flex-direction: column;
    align-items: end;
    gap: 7px;
  }
  body.requests-mode .detail-heading code {
    max-width: 300px;
    overflow: hidden;
    color: var(--faint);
    font-size: 11px;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  body.requests-mode .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 8px 12px;
    border-radius: 999px;
    background: var(--panel);
    color: var(--paper);
    font-size: 13px;
    font-weight: 650;
    font-variant-numeric: tabular-nums;
  }
  body.requests-mode .status-pill::before {
    content: "";
    width: 7px;
    height: 7px;
    border-radius: 999px;
    background: var(--ok);
  }
  body.requests-mode .status-pill.status-failed::before { background: var(--bad); }
  body.requests-mode .status-pill.status-processing::before { background: var(--kibble); }
  body.requests-mode .image-stage {
    position: relative;
    overflow: hidden;
    border-radius: 20px;
    background: #111114;
  }
  body.requests-mode #requestImage {
    width: 100%;
    max-height: 68vh;
    object-fit: contain;
  }
  .detection-count {
    position: absolute;
    top: 14px;
    right: 14px;
    padding: 7px 11px;
    border-radius: 999px;
    background: rgba(17, 17, 20, .78);
    color: #fff;
    font-size: 12px;
    font-weight: 650;
    backdrop-filter: blur(12px);
  }
  body.requests-mode .legend {
    align-items: center;
    gap: 18px;
    margin: 10px 2px 20px;
    color: var(--dim);
    font-size: 12px;
  }
  body.requests-mode .legend a {
    margin-left: auto;
    color: var(--paper);
    font-weight: 600;
    text-underline-offset: 3px;
  }
  body.requests-mode .legend span::before { border-color: var(--raw-box); }
  body.requests-mode .legend .crop-key::before {
    border-color: var(--crop-box);
    border-top-style: dashed;
  }
  body.requests-mode .meta-grid {
    grid-template-columns: repeat(4, minmax(130px, 1fr));
    gap: 8px;
    margin: 0 0 28px;
  }
  body.requests-mode .meta {
    min-width: 0;
    padding: 13px 14px;
    border-radius: 14px;
    background: var(--panel);
  }
  body.requests-mode .meta-label {
    color: var(--dim);
    font-size: 11px;
    font-weight: 550;
    letter-spacing: 0;
    text-transform: none;
  }
  body.requests-mode .meta-value {
    margin-top: 4px;
    color: var(--paper);
    font-size: 14px;
    font-variant-numeric: tabular-nums;
    overflow-wrap: anywhere;
  }
  .section-heading {
    margin: 0 0 10px;
    color: var(--paper);
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -.018em;
  }
  body.requests-mode .detection-card {
    grid-template-columns: minmax(160px, 240px) minmax(240px, 1fr);
    gap: 20px;
    margin-top: 10px;
    padding: 18px;
    border: 0;
    border-radius: 20px;
    background: var(--panel);
  }
  body.requests-mode .crop-image {
    width: 100%;
    max-height: 240px;
    border-radius: 14px;
    background: var(--paper);
  }
  body.requests-mode .detection-title {
    margin-bottom: 6px;
    color: var(--paper);
    font-size: 16px;
    font-weight: 700;
  }
  body.requests-mode .score-note {
    margin: 7px 0;
    color: var(--dim);
    font-size: 12px;
    font-variant-numeric: tabular-nums;
  }
  body.requests-mode .row {
    color: var(--paper);
    font-size: 13px;
    font-variant-numeric: tabular-nums;
  }
  body.requests-mode .bar {
    height: 7px;
    margin: 6px 0;
    border-radius: 999px;
    background: var(--panel-2);
  }
  body.requests-mode .bar > div {
    border-radius: inherit;
    background: var(--ok);
  }
  body.requests-mode .muted { color: var(--dim); }
  body.requests-mode .empty-state {
    color: var(--dim);
    font-size: 14px;
  }
  body.requests-mode .error-box {
    border: 1px solid color-mix(in srgb, var(--bad) 35%, transparent);
    border-radius: 14px;
    background: color-mix(in srgb, var(--bad) 8%, white);
    color: var(--bad);

  body.requests-mode :focus-visible {
    outline: 2px solid rgba(17, 17, 20, .5);
    outline-offset: 2px;
  }
  @media (max-width: 1100px) {
    body.requests-mode .meta-grid { grid-template-columns: repeat(3, minmax(120px, 1fr)); }
  }
  @media (max-width: 880px) {
    body.requests-mode .site-header { padding: 18px 20px 9px; }
    body.requests-mode .workspace-title { padding: 0 20px 15px; }
    body.requests-mode .pipeline-copy { display: none; }
    body.requests-mode .requests-view {
      grid-template-columns: 1fr;
      padding: 20px 20px 44px;
    }
    body.requests-mode .request-browser { position: static; }
    body.requests-mode #requestList { max-height: 280px; }
  }
  @media (max-width: 620px) {
    .brand-copy { align-items: start; flex-direction: column; gap: 0; }
    body.requests-mode .requests-view { padding-inline: 14px; }
    body.requests-mode .detail-heading { display: block; }
    .detail-heading-meta { align-items: start; margin-top: 12px; }
    body.requests-mode .meta-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    body.requests-mode .detection-card { grid-template-columns: 1fr; }
    body.requests-mode .legend { flex-wrap: wrap; }
    body.requests-mode .legend a { width: 100%; margin-left: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .status-processing { animation: none; }
  }
</style>
</head>
<body class="requests-mode">
<header class="site-header">
  <div class="brand-lockup">
    <span class="brand-copy"><strong>PetVision</strong><span>Vision Host</span></span>
  </div>
  <span class="pipeline-copy">Detect → crop → embed</span>
</header>
<h1 class="workspace-title">Requests <span id="requestBadge"></span></h1>
<main id="requestsView" class="requests-view">
  <section class="card request-browser" aria-label="API request history">
    <div class="request-tools">
      <div class="request-tools-head">
        <div>
          <span class="request-eyebrow">Image API</span>
          <strong>Requests</strong>
        </div>
      </div>
      <div id="historyStats" class="muted">Loading…</div>
      <div class="request-tools-row">
        <select id="endpointFilter" aria-label="Filter by endpoint">
          <option value="">All endpoints</option>
          <option value="/embed">/embed</option>
          <option value="/identify">/identify</option>
          <option value="/enroll">/enroll</option>
        </select>
        <select id="statusFilter" aria-label="Filter by status">
          <option value="">All outcomes</option>
          <option value="completed">Completed</option>
          <option value="failed">Failed</option>
          <option value="processing">Processing</option>
        </select>
      </div>
      <div class="request-tools-row">
        <button id="liveToggle" class="secondary">Live: on</button>
        <button id="clearHistory" class="danger">Clear</button>
      </div>
    </div>
    <div id="requestList"><div class="empty-state">No image requests yet.</div></div>
  </section>

  <section class="card request-detail" id="requestDetail">
    <div class="empty-state">Select a request to inspect its image and perception results.</div>
  </section>
</main>

<script>
let liveRequests = true;
let selectedRequestId = null;
let requestListSignature = '';
let loadedRequestVersion = '';

const escapeHtml = value => String(value ?? '').replace(/[&<>'"]/g, char => ({
  '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
})[char]);

function formatBytes(value) {
  if (value == null) return 'N/A';
  const units = ['B', 'KiB', 'MiB', 'GiB'];
  let number = value, unit = 0;
  while (number >= 1024 && unit < units.length - 1) { number /= 1024; unit++; }
  return `${number.toFixed(unit ? 1 : 0)} ${units[unit]}`;
}

function formatTime(value) {
  if (!value) return 'now';
  return new Intl.DateTimeFormat(undefined, {
    hour: 'numeric', minute: '2-digit', second: '2-digit'
  }).format(new Date(value));
}

async function refreshRequests() {
  const endpoint = document.getElementById('endpointFilter').value;
  const status = document.getElementById('statusFilter').value;
  const params = new URLSearchParams({ limit: '1000' });
  if (endpoint) params.set('endpoint', endpoint);
  if (status) params.set('status', status);
  let data;
  try { data = await (await fetch(`/diagnostics/requests?${params}`)).json(); }
  catch (error) {
    document.getElementById('historyStats').textContent = `Unavailable: ${error.message}`;
    return;
  }

  document.getElementById('requestBadge').textContent = data.retained ? `(${data.retained})` : '';
  document.getElementById('historyStats').textContent =
    `${data.total} shown · ${formatBytes(data.retained_bytes)} / ${formatBytes(data.max_bytes)}`;
  const signature = JSON.stringify(data.requests.map(r =>
    [r.id, r.status, r.http_status, r.ms, r.pet_count]));
  if (signature !== requestListSignature) {
    requestListSignature = signature;
    renderRequestList(data.requests);
  }

  if (selectedRequestId && !data.requests.some(r => r.id === selectedRequestId)) {
    selectedRequestId = null;
    loadedRequestVersion = '';
    document.getElementById('requestDetail').innerHTML =
      '<div class="empty-state">Select a request to inspect its image and perception results.</div>';
  }
  if (!selectedRequestId && data.requests.length) {
    await selectRequest(data.requests[0].id);
  } else if (selectedRequestId) {
    const selected = data.requests.find(r => r.id === selectedRequestId);
    const version = selected ? `${selected.id}:${selected.status}:${selected.http_status}:${selected.ms}` : '';
    if (version !== loadedRequestVersion) await loadRequestDetail(selectedRequestId);
  }
}

function renderRequestList(requests) {
  const list = document.getElementById('requestList');
  if (!requests.length) {
    list.innerHTML = '<div class="empty-state">No matching image requests.</div>';
    return;
  }
  list.innerHTML = requests.map(request => {
    const count = request.pet_count;
    const countText = count == null
      ? (request.status === 'failed' ? 'Request failed' : 'Processing')
      : `${count} Detection${count === 1 ? '' : 's'}`;
    const result = request.top_result ? ` · ${escapeHtml(request.top_result)}` : '';
    const latency = request.ms == null ? 'processing' : `${request.ms} ms`;
    return `<button class="request-row ${request.id === selectedRequestId ? 'selected' : ''}"
                    data-request-id="${request.id}">
      <span class="request-row-top">
        <span><i class="status-dot status-${request.status}"></i><span class="endpoint">${request.endpoint}</span></span>
        <span>${formatTime(request.started_at)}</span>
      </span>
      <span class="request-row-sub">
        <span>${countText}${result}</span><span>${latency}</span>
      </span>
    </button>`;
  }).join('');
}

async function selectRequest(requestId) {
  selectedRequestId = requestId;
  loadedRequestVersion = '';
  document.querySelectorAll('.request-row').forEach(row =>
    row.classList.toggle('selected', row.dataset.requestId === requestId));
  await loadRequestDetail(requestId);
}

async function loadRequestDetail(requestId) {
  let response, detail;
  try {
    response = await fetch(`/diagnostics/requests/${requestId}`);
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    detail = await response.json();
  } catch (error) {
    if (requestId === selectedRequestId) {
      document.getElementById('requestDetail').innerHTML =
        `<div class="error-box">Could not load request: ${escapeHtml(error.message)}</div>`;
    }
    return;
  }
  if (requestId !== selectedRequestId) return;
  loadedRequestVersion = `${detail.id}:${detail.status}:${detail.http_status}:${detail.ms}`;
  renderRequestDetail(detail);
}

function meta(label, value) {
  return `<div class="meta"><div class="meta-label">${escapeHtml(label)}</div>
    <div class="meta-value">${escapeHtml(value ?? 'N/A')}</div></div>`;
}

function scoreRows(match) {
  if (!match?.available) {
    return `<div class="score-note">Similarity unavailable: ${escapeHtml(match?.reason || 'no Embedding')}</div>`;
  }
  const verdict = match.known ? escapeHtml(match.name) :
    `Unknown <span class="muted">(best: ${escapeHtml(match.best_pet)})</span>`;
  const rows = Object.entries(match.scores || {}).map(([name, score]) => {
    const width = Math.max(0, Math.min(100, Number(score) * 100));
    return `<div class="row"><span>${escapeHtml(name)}</span><span>${Number(score).toFixed(3)}</span></div>
      <div class="bar"><div style="width:${width}%"></div></div>`;
  }).join('');
  return `<div class="detection-title">${verdict}</div>
    <div class="score-note">Matching confidence ${match.confidence} · request threshold ${match.threshold}${
      match.role ? `<br>${escapeHtml(match.role)}` : ''}</div><div class="score-table">${rows}</div>`;
}

function renderRequestDetail(request) {
  const statusText = request.status === 'processing' ? 'Processing' :
    `${request.http_status ?? 'N/A'} · ${request.status}`;
  const size = request.upright_size ? `${request.upright_size[0]} × ${request.upright_size[1]}` : 'N/A';
  const query = Object.keys(request.query || {}).length ? JSON.stringify(request.query) : 'none';
  const detectionCount = request.pet_count == null
    ? 'Processing'
    : `${request.pet_count} Detection${request.pet_count === 1 ? '' : 's'}`;
  const detections = (request.detections || []).map((detection, index) => `
    <article class="detection-card">
      <div>
        ${detection.crop_url ? `<img class="crop-image" src="${detection.crop_url}" alt="Detection ${index + 1} crop">` : ''}
        <div class="score-note">Crop ${detection.crop_size?.join(' × ') || 'N/A'} · Embedding ${detection.embedding_dim || 'N/A'} dimensions</div>
      </div>
      <div>
        <div class="detection-title">Detection ${index + 1} · ${escapeHtml(detection.class)}</div>
        <div class="score-note">YOLO confidence ${detection.yolo_confidence}<br>
          Raw box ${detection.raw_box_pixels?.join(', ') || 'N/A'}<br>
          Embedded crop ${detection.crop_box_pixels?.join(', ') || 'N/A'}</div>
        ${scoreRows(detection.match)}
      </div>
    </article>`).join('');
  const wholeFrame = request.whole_frame ? `
    <article class="detection-card"><div><div class="detection-title">Whole-frame Embedding</div>
      <div class="score-note">${request.whole_frame.embedding_dim} dimensions · generated for the 0/2+ enrollment path</div></div>
      <div>${scoreRows(request.whole_frame.match)}</div></article>` : '';

  document.getElementById('requestDetail').innerHTML = `
    <div class="detail-heading">
      <div>
        <p class="detail-eyebrow">Image API request</p>
        <h2><span class="endpoint">${request.endpoint}</span></h2>
      </div>
      <div class="detail-heading-meta">
        <span class="status-pill status-${request.status}">${statusText}</span>
        <code title="${request.id}">${request.id}</code>
      </div>
    </div>
    ${request.error ? `<div class="error-box">${escapeHtml(request.error)}</div>` : ''}
    ${request.image_url ? `<div class="image-stage"><canvas id="requestImage"></canvas>
        <span class="detection-count">${detectionCount}</span></div>
      <div class="legend"><span>Raw YOLO box</span><span class="crop-key">Embedded crop</span>
      <a href="${request.image_url}" target="_blank" rel="noopener">Open original</a></div>` :
      '<div class="empty-state">The request ended before an image could be retained.</div>'}
    <div class="meta-grid">
      ${meta('Received', new Date(request.started_at).toLocaleString())}
      ${meta('Status', statusText)}
      ${meta('Latency', request.ms == null ? 'N/A' : `${request.ms} ms`)}
      ${meta('Detections', request.pet_count)}
      ${meta('Image', `${size} · ${formatBytes(request.input_bytes)}`)}
      ${meta('Original size', request.original_size?.join(' × '))}
      ${meta('EXIF orientation', request.exif_orientation || 'none')}
      ${meta('Client', request.client)}
      ${meta('Input', `${request.request_format} · ${request.content_type || 'unknown'}`)}
      ${meta('Filename', request.filename)}
      ${meta('Enroll Pet', request.enrollment_name)}
      ${meta('Query', query)}
    </div>
    <h3 class="section-heading">Detections</h3>
    ${detections || '<div class="muted">No pet Detections were produced.</div>'}
    ${wholeFrame}`;
  if (request.image_url) drawRequestImage(request);
}

async function drawRequestImage(request) {
  const canvas = document.getElementById('requestImage');
  if (!canvas) return;
  try {
    if (document.fonts?.ready) await document.fonts.ready;
    const blob = await (await fetch(request.image_url)).blob();
    const bitmap = await createImageBitmap(blob);
    if (!canvas.isConnected) return;
    canvas.width = bitmap.width; canvas.height = bitmap.height;
    const ctx = canvas.getContext('2d');
    const styles = getComputedStyle(document.body);
    const rawColor = styles.getPropertyValue('--raw-box').trim() || '#c98a3b';
    const cropColor = styles.getPropertyValue('--crop-box').trim() || '#3e8e52';
    ctx.drawImage(bitmap, 0, 0);
    const lineWidth = Math.max(2, Math.round(bitmap.width / 250));
    const labelFontSize = Math.max(13, Math.round(bitmap.width / 40));
    ctx.font = `650 ${labelFontSize}px "Hanken Grotesk", system-ui, sans-serif`;
    ctx.textBaseline = 'top';
    (request.detections || []).forEach((detection, index) => {
      const boxes = [
        { box: detection.raw_box, color: rawColor, dashed: false },
        { box: detection.crop_box, color: cropColor, dashed: true }
      ];
      boxes.forEach(({ box, color, dashed }) => {
        if (!box) return;
        const [x, y, w, h] = box.map((value, i) =>
          value * (i % 2 === 0 ? bitmap.width : bitmap.height));
        ctx.setLineDash(dashed ? [10, 7] : []);
        ctx.lineWidth = lineWidth + 3;
        ctx.strokeStyle = 'rgba(17, 17, 20, .72)';
        ctx.strokeRect(x, y, w, h);
        ctx.lineWidth = lineWidth;
        ctx.strokeStyle = color;
        ctx.strokeRect(x, y, w, h);
      });
      ctx.setLineDash([]);
      const [x, y] = detection.raw_box || [0, 0];
      const label = `${index + 1} · ${detection.class} ${detection.yolo_confidence}`;
      const px = x * bitmap.width, py = y * bitmap.height;
      ctx.fillStyle = rawColor;
      ctx.fillRect(px, py, ctx.measureText(label).width + 10, labelFontSize + 6);
      ctx.fillStyle = '#111114'; ctx.fillText(label, px + 5, py + 3);
    });
  } catch (error) {
    canvas.replaceWith(Object.assign(document.createElement('div'), {
      className: 'error-box', textContent: `Could not display original image: ${error.message}`
    }));
  }
}

document.getElementById('requestList').onclick = event => {
  const row = event.target.closest('[data-request-id]');
  if (row) selectRequest(row.dataset.requestId);
};
document.getElementById('endpointFilter').onchange = () => {
  selectedRequestId = null; loadedRequestVersion = ''; requestListSignature = ''; refreshRequests();
};
document.getElementById('statusFilter').onchange = () => {
  selectedRequestId = null; loadedRequestVersion = ''; requestListSignature = ''; refreshRequests();
};
document.getElementById('liveToggle').onclick = event => {
  liveRequests = !liveRequests;
  event.target.textContent = `Live: ${liveRequests ? 'on' : 'paused'}`;
  if (liveRequests) refreshRequests();
};
document.getElementById('clearHistory').onclick = async () => {
  if (!confirm('Clear all in-memory request history? This cannot be undone.')) return;
  await fetch('/diagnostics/requests', { method: 'DELETE' });
  selectedRequestId = null; loadedRequestVersion = ''; requestListSignature = '';
  await refreshRequests();
};
refreshRequests();
setInterval(() => {
  if (liveRequests) refreshRequests();
}, 1000);
</script>
</body>
</html>
